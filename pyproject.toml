[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "security-backport-harness"
version = "0.1.0"
description = "Agent-assisted security backports with execution evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.28,<1", "openai>=2.0,<3", "pydantic>=2.10,<3", "typer>=0.16,<1"]

[project.scripts]
backport = "backport_harness.cli:app"

[dependency-groups]
dev = ["build", "mypy", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/backport_harness"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
