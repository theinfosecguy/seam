[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "seam"
version = "0.4.0"
description = "Security backports with independent test evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "detect-secrets>=1.5,<2",
    "genai-prices>=0.0.67,<1",
    "httpx>=0.28,<1",
    "httpx2>=2.10,<3",
    "pydantic-ai-slim[anthropic,bedrock,google,groq,mistral,openai,openrouter]>=2.57,<3",
    "pydantic>=2.10,<3",
    "typer>=0.16,<1",
]

[project.scripts]
seam = "seam.cli:app"

[dependency-groups]
dev = ["build", "mypy", "pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/seam"]

[tool.hatch.build.targets.wheel.force-include]
"evals/python" = "seam/evals/data/python"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]
# Historical evidence retains the exact tested source bytes and hashes.
extend-exclude = ["evals/recent-backports/2026-10-24"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "UP", "B", "SIM", "RUF", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[[tool.mypy.overrides]]
module = ["detect_secrets.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
