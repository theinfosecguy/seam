[oracle]
path = "oracle.mjs"
security_test = "test_security"
controls = ["test_ordinary_scheme", "test_ordinary_serialize"]
failure_marker = "URI_ENCODED_SCHEME_REJECTED"

[runner]
kind = "node"
image = "sha256:52f40f96867d88d68ced00067878ab5b917744d17f5649b82506f43e72d88cba"
docker = ["sudo", "-n", "docker"]
suite = ["test/scheme-validation.test.js"]
timeout_seconds = 120
