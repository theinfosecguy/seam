schema_version = 1
max_attempts = 1

[oracle]
path = "oracle.py"
security_test = "test_security_unknown_critical_header"
controls = ["test_control_normal_signed_payload", "test_control_noncritical_private_header", "test_control_known_critical_header"]
failure_marker = "AUTHLIB_CRITICAL_HEADER_REGRESSION"

[runner]
image = "seam-eval-authlib:python-v1"
docker = ["docker"]
suite = ["tests/jose/test_jws.py"]
import_mode = "prepend"
timeout_seconds = 120
memory_mb = 512
cpus = 1
pids = 128
plugins = []

