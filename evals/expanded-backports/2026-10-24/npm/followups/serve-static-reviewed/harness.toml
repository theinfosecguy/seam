[oracle]
path = "oracle.mjs"
security_test = "test_security"
controls = ["test_redirect_location", "test_file_content"]
failure_marker = "STATIC_REDIRECT_HAS_NO_LINK"

[runner]
kind = "mocha"
image = "sha256:52f40f96867d88d68ced00067878ab5b917744d17f5649b82506f43e72d88cba"
