[oracle]
path = "oracle.mjs"
security_test = "test_security"
controls = ["test_plain_text", "test_compressed_text", "test_other_consumer_preserved"]
failure_marker = "CHARSET_CHECK_BEFORE_DECOMPRESSION"

[runner]
kind = "mocha"
image = "sha256:52f40f96867d88d68ced00067878ab5b917744d17f5649b82506f43e72d88cba"
docker = ["sudo", "-n", "docker"]
suite = ["test/json.js"]
timeout_seconds = 120
mocha_grep = "^bodyParser.json\\(\\) (?:should parse JSON|should handle Content-Length: 0|should handle duplicated middleware)$"

[runner.node_dependencies]
