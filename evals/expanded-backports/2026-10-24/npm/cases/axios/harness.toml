[oracle]
path = "oracle.mjs"
security_test = "test_security"
controls = ["test_absolute_url_default", "test_absolute_url_enabled"]
failure_marker = "AXIOS_BASE_URL_RESTRICTION"

[runner]
kind = "mocha"
image = "sha256:52f40f96867d88d68ced00067878ab5b917744d17f5649b82506f43e72d88cba"
docker = ["sudo", "-n", "docker"]
suite = ["test/unit/adapters/http.js"]
timeout_seconds = 120
